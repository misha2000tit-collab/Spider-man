<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>WEB CITY — Prototype</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
  #game{position:fixed;inset:0} canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff}
  #brand{position:absolute;top:14px;left:15px;font-weight:900;letter-spacing:2px;font-size:14px;text-shadow:0 2px 8px #000}
  #help{position:absolute;top:40px;left:15px;font-size:11px;color:#d6e4f5;text-shadow:0 2px 8px #000}
  #status{position:absolute;top:14px;right:15px;font-size:11px;color:#d6e4f5;text-align:right;text-shadow:0 2px 8px #000}
  #controls{position:absolute;inset:0;pointer-events:none}
  #stick{position:absolute;left:22px;bottom:28px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:1px solid #ffffff55;pointer-events:auto;touch-action:none}
  #nub{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#ffffff65;border:1px solid #fff8}
  .btn{position:absolute;right:22px;border:1px solid #ffffff88;background:#12243dcc;color:#fff;border-radius:50%;width:66px;height:66px;font-weight:800;font-size:12px;pointer-events:auto;touch-action:none;box-shadow:0 5px 20px #0005}
  #jump{bottom:35px} #web{bottom:112px;width:76px;height:76px;right:96px;background:#087ecccc}
  #web.active{background:#13b7a8}
  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 13px;border-radius:12px;background:#08111dcc;font-size:12px;color:#fff;text-align:center;max-width:85%;transition:opacity .5s}
  @media (min-width:800px){#stick{width:130px;height:130px}#nub{left:40px;top:40px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="brand">WEB CITY <span style="color:#42d9d0">/</span> TEST BUILD</div>
  <div id="help">Свободное исследование города</div>
  <div id="status">Загрузка 3D…</div>
  <div id="hint">Левый круг — движение · WEB — зацепиться за здание · JUMP — прыжок</div>
  <div id="controls">
    <div id="stick"><div id="nub"></div></div>
    <button class="btn" id="jump">JUMP</button>
    <button class="btn" id="web">WEB</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const root=document.querySelector('#game');
const statusEl=document.querySelector('#status');
const hint=document.querySelector('#hint');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b9d5);
scene.fog=new THREE.Fog(0x91b9d5,75,230);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff,0x526070,2.1));
const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-50,90,35);scene.add(sun);

const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x303b48), roadMat=mat(0x202a35), lineMat=mat(0x9aa9b4);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;scene.add(ground);

// A simple block-city grid. Buildings are original procedural geometry.
const buildings=[];
const buildingMat=[0x667b8d,0x526b82,0x7b8995,0x465c70,0x8b9297,0x536273].map(c=>mat(c));
for(let gx=-4;gx<=4;gx++) for(let gz=-4;gz<=4;gz++){
  if(Math.abs(gx)<1&&Math.abs(gz)<1) continue;
  const x=gx*27, z=gz*27, w=13+(Math.abs(gx*13+gz*7)%7), d=13+(Math.abs(gx*5-gz*11)%7);
  const h=12+((Math.abs(gx*19+gz*23)%6)*5);
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMat[(gx*gx+gz*gz)%buildingMat.length]);
  b.position.set(x,h/2,z);scene.add(b);
  // rooftop rim
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.5,d+.5),mat(0x293b4b));
  roof.position.set(x,h+.15,z);scene.add(roof);
  buildings.push({x,z,w,d,h,top:new THREE.Vector3(x,h+2,z)});
  // windows: thin rows on visible faces
  const winMat=new THREE.MeshBasicMaterial({color:0xb9d9e8});
  for(let yy=3;yy<h-2;yy+=4){
    for(let xx=-w/2+1.4;xx<w/2-1;xx+=2.6){
      const win=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.8),winMat);
      win.position.set(x+xx,yy,z+d/2+.012);scene.add(win);
    }
  }
}
// Roads and simple lane markings
for(let i=-4;i<=4;i++){
  const roadA=new THREE.Mesh(new THREE.PlaneGeometry(8,260),roadMat);roadA.rotation.x=-Math.PI/2;roadA.position.set(i*27,-.045,0);scene.add(roadA);
  const roadB=new THREE.Mesh(new THREE.PlaneGeometry(260,8),roadMat);roadB.rotation.x=-Math.PI/2;roadB.position.set(0,-.044,i*27);scene.add(roadB);
}
const plaza=new THREE.Mesh(new THREE.BoxGeometry(18,.25,18),mat(0x657b83));plaza.position.set(0,0,0);scene.add(plaza);

// Stylized original hero placeholder (not an official character model).
const hero=new THREE.Group();scene.add(hero);
const suit=mat(0x174c9b), accent=mat(0xd83c45), dark=mat(0x101b2c), eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.85,4,8),suit);torso.position.y=1.45;hero.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.42,12,10),accent);head.position.y=2.45;hero.add(head);
const mask=new THREE.Mesh(new THREE.SphereGeometry(.425,12,10),suit);mask.scale.set(1,.9,.85);mask.position.y=2.47;hero.add(mask);
for(const side of [-1,1]){
 const eye=new THREE.Mesh(new THREE.SphereGeometry(.105,8,6),eyeMat);eye.scale.set(1,.65,.35);eye.position.set(side*.17,2.5,.36);hero.add(eye);
 const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.72,3,6),accent);arm.position.set(side*.68,1.55,0);arm.rotation.z=side*-.25;hero.add(arm);
 const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.7,3,6),dark);leg.position.set(side*.23,.55,0);hero.add(leg);
}
hero.position.set(0,0,0);

const velocity=new THREE.Vector3(), forward=new THREE.Vector3(0,0,-1);
let yaw=0, vertical=0, grounded=true, swinging=false, anchor=null, ropeLength=0;
const clock=new THREE.Clock();
const input={x:0,y:0};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');
let stickPointer=null;
function setStick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),max=43;
 if(mag>max){dx=dx/mag*max;dy=dy/mag*max}
 input.x=dx/max;input.y=dy/max;
 nub.style.transform=`translate(${dx}px,${dy}px)`;
}
stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)setStick(e)});
function releaseStick(e){if(e.pointerId===stickPointer){stickPointer=null;input.x=0;input.y=0;nub.style.transform=''}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);

function jump(){if(grounded){velocity.y=9;grounded=false}else if(swinging){velocity.y+=3}}
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
const webBtn=document.querySelector('#web');
function nearestAnchor(){
 let best=null,bestScore=1e9;
 const p=hero.position;
 for(const b of buildings){
   const dx=b.x-p.x,dz=b.z-p.z,dist=Math.hypot(dx,dz);
   if(dist>58||b.h<8)continue;
   const score=dist+Math.abs(dz)*.15;
   if(score<bestScore){bestScore=score;best=b.top.clone()}
 }
 return best;
}
function toggleWeb(){
 if(swinging){swinging=false;anchor=null;webBtn.classList.remove('active');return}
 const a=nearestAnchor();
 if(a){anchor=a;ropeLength=Math.max(7,hero.position.distanceTo(anchor)*.9);swinging=true;webBtn.classList.add('active');}
}
webBtn.addEventListener('pointerdown',e=>{e.preventDefault();toggleWeb()});

function update(dt){
 dt=Math.min(dt,.033);
 const move=new THREE.Vector3(input.x,0,-input.y);
 if(move.lengthSq()>.01){
   move.normalize();
   const camForward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
   const camRight=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
   const dir=camRight.multiplyScalar(move.x).add(camForward.multiplyScalar(move.z)).normalize();
   const speed=swinging?13:grounded?8:6;
   velocity.x+=(dir.x*speed-velocity.x)*Math.min(1,dt*5);
   velocity.z+=(dir.z*speed-velocity.z)*Math.min(1,dt*5);
   yaw=Math.atan2(dir.x,dir.z);
 }else if(!swinging){velocity.x*=Math.max(0,1-dt*3);velocity.z*=Math.max(0,1-dt*3)}
 velocity.y-=19*dt;
 if(swinging&&anchor){
   const next=hero.position.clone().add(velocity.clone().multiplyScalar(dt));
   const delta=next.clone().sub(anchor),dist=delta.length();
   if(dist>ropeLength){
     const n=delta.normalize();
     next.copy(anchor).add(n.multiplyScalar(ropeLength));
     const outward=velocity.dot(n);
     if(outward>0)velocity.addScaledVector(n,-outward);
   }
   hero.position.copy(next);
   // gentle forward pumping
   velocity.x+=input.x*4*dt;velocity.z-=input.y*4*dt;
 }else{
   hero.position.addScaledVector(velocity,dt);
 }
 if(hero.position.y<=0){hero.position.y=0;velocity.y=0;grounded=true;if(swinging){swinging=false;anchor=null;webBtn.classList.remove('active')}}
 // Keep the hero within the playable city.
 hero.position.x=THREE.MathUtils.clamp(hero.position.x,-118,118);
 hero.position.z=THREE.MathUtils.clamp(hero.position.z,-118,118);
 hero.rotation.y=yaw;
 // Camera follows behind and above the hero.
 const desired=new THREE.Vector3(hero.position.x+Math.sin(yaw)*8,hero.position.y+5.2,hero.position.z+Math.cos(yaw)*8);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 const look=hero.position.clone().add(new THREE.Vector3(0,1.7,0));
 camera.lookAt(look);
 statusEl.textContent=`X ${Math.round(hero.position.x)} · Z ${Math.round(hero.position.z)}${swinging?' · WEB ATTACHED':''}`;
}
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();update(dt);renderer.render(scene,camera)}
camera.position.set(0,6,9);camera.lookAt(0,1,0);animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>{hint.style.opacity='0'},6500);
statusEl.textContent='ГОРОД ЗАГРУЖЕН';
</script>
</body>
</html>
